<!-- Stream start dialog (rendered outside the player so it's not clipped) -->
<app-stream-start-dialog
  *ngIf="showStreamDialog"
  [browserSettings]="browserSettings"
  [audienceMode]="'room'"
  (confirmed)="onStreamDialogConfirmed($event)"
  (cancelled)="onStreamDialogCancelled()">
</app-stream-start-dialog>

<div class="webrtc-viewer vh-big d-flex align-items-center justify-content-center bg-black position-relative h-100">

  <!-- Broadcast controls (host / moderator only, visible when NOT already streaming) -->
  <div *ngIf="IsHost && !isBroadcasting" class="position-absolute top-0 right-0 m-2">
    <button class="btn btn-sm btn-primary" (click)="startBroadcast()" title="Broadcast your screen or camera to everyone in the room">
      <i class="fa fa-broadcast-tower"></i> Broadcast
    </button>
  </div>

  <!-- The broadcaster's own controls -->
  <div *ngIf="isBroadcasting" class="position-absolute top-0 right-0 m-2 d-flex align-items-center">
    <span *ngIf="!broadcastReconnecting" class="badge badge-primary mr-2">
      <i class="fa fa-circle blink"></i> Broadcasting…
    </span>
    <span *ngIf="broadcastReconnecting" class="badge badge-warning mr-2">
      <i class="fa fa-refresh fa-spin"></i> Reconnecting…
    </span>
    <button *ngIf="!isRecording" class="btn btn-sm btn-outline-danger mr-2" (click)="startRecording()" title="Record your broadcast on the server">
      <i class="fa fa-circle"></i> Record
    </button>
    <button *ngIf="isRecording" class="btn btn-sm btn-danger mr-2" (click)="stopRecording()" title="Stop recording">
      <i class="fa fa-stop"></i> Stop recording
    </button>
    <button class="btn btn-sm btn-outline-light mr-2" (click)="toggleLocalPreview()"
            [title]="showLocalPreview ? 'Hide local preview' : 'Show local preview'">
      <i class="fa" [class.fa-eye-slash]="showLocalPreview" [class.fa-eye]="!showLocalPreview"></i>
      {{ showLocalPreview ? 'Hide preview' : 'Show preview' }}
    </button>
    <button class="btn btn-sm btn-outline-light" (click)="stopBroadcast()" title="Stop broadcast">
      <i class="fa fa-stop"></i> Stop
    </button>
  </div>

  <!-- A finished recording, for the broadcaster to download -->
  <div *ngIf="savedRecordingUrl" class="position-absolute bottom-0 left-0 m-2 webrtc-recording-saved d-flex align-items-center">
    <i class="fa fa-check-circle text-success mr-2"></i>
    <span class="small mr-2">Recording saved.</span>
    <a class="btn btn-sm btn-outline-light mr-2" [href]="savedRecordingUrl" download>
      <i class="fa fa-download"></i> Download
    </a>
    <button class="btn btn-sm btn-link text-light p-0" (click)="dismissSavedRecording()" title="Dismiss">
      <i class="fa fa-times"></i>
    </button>
  </div>

  <div *ngIf="isLoading && !connectionFailed && !isShowingLocalPreview && !isPreviewHiddenState" class="text-center text-light">
    <div class="spinner-border text-main-color mb-3" role="status">
      <span class="sr-only">Connecting…</span>
    </div>
    <p class="small">Connecting to stream…</p>
  </div>

  <div *ngIf="isPreviewHiddenState" class="webrtc-preview-hidden text-center text-light px-4">
    <div class="webrtc-preview-hidden__badge mb-3">
      <i class="fa fa-circle blink mr-2"></i>You are live to the room
    </div>
    <p class="small mb-3">Your stream is still going out to everyone. The local preview is hidden on purpose.</p>
    <button class="btn btn-sm btn-outline-light" (click)="toggleLocalPreview()">
      <i class="fa fa-eye mr-1"></i>Show preview
    </button>
  </div>

  <!-- The stage connection dropped and is being restored -->
  <div *ngIf="reconnecting && hasStream" class="position-absolute top-0 left-0 m-2">
    <span class="badge badge-warning"><i class="fa fa-refresh fa-spin mr-1"></i>Reconnecting…</span>
  </div>

  <!-- Connection failure prompt -->
  <div *ngIf="connectionFailed" class="text-center text-light webrtc-failed">
    <i class="fa fa-exclamation-triangle fa-2x text-warning mb-2"></i>
    <p>The connection to the stream was lost.</p>
    <button class="btn btn-sm btn-outline-light" (click)="retryConnection()">
      <i class="fa fa-refresh"></i> Retry
    </button>
  </div>

  <!-- Remote video stream -->
  <video
    #remoteVideo
    [class.d-none]="!hasStream || connectionFailed"
    controls
    class="webrtc-video w-100 h-100"
    autoplay
    playsinline
    style="object-fit: contain; max-height: 100%;">
  </video>

  <div *ngIf="isShowingLocalPreview" class="webrtc-local-preview-shell w-100 h-100 position-relative">
    <video
      #localPreviewVideo
      class="webrtc-video w-100 h-100"
      autoplay
      muted
      playsinline
      style="object-fit: contain; max-height: 100%;">
    </video>
  </div>

  <!-- Recording indicator (visible to all when recording is active) -->
  <div *ngIf="isRecording" class="position-absolute top-0 left-0 m-2 d-flex align-items-center">
    <span class="badge badge-danger d-flex align-items-center">
      <i class="fa fa-circle text-danger blink mr-1"></i> REC
    </span>
  </div>

</div>
