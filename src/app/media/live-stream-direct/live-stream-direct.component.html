<div class="overflow-hidden m-0 p-0" (mousemove)="showLeave()">
  <app-mpegts-player *ngIf="isLive" [IsHost]="true" (NetworkError)="LeaveRoom()"></app-mpegts-player>
</div>
<button class="btn btn-danger leaveBtn" [class.hide]="!leaveVisible" (click)="Leave()"><i class="fa fa-sign-out" aria-hidden="true"></i></button>
<p *ngIf="!isLive" class="text-center mt-5"><i class="fa fa-circle-o-notch fa-spin fa-4x" aria-hidden="true"></i></p>
