<div class="transition PlayerWindow vh-big" [class.BlackjackBg]="CurrentPlayerType==PlayerType.Blackjack"
     [class.bg-black]="CurrentPlayerType!=PlayerType.Nothing">
  <div class="row m-0">
    <div id="playerContainer" class="vh-big">
      <!-- WebRtc: P2P / SFU screen-share viewer -->
      <app-webrtc *ngIf="CurrentPlayerType==PlayerType.WebRtc" [UniqueId]="UniqueId" [IsHost]="IsHost"></app-webrtc>

       <!-- FileShare host instance: shown immediately after clicking Share, before the
         SFU share has fully started, so the picker is always available locally. -->
       <app-file-share-player *ngIf="CurrentPlayerType==PlayerType.FileShare && (webRtcService.isPreparingFileShareHost || webRtcService.isFileShareHost)"
                  [UniqueId]="UniqueId"
                  [IsHost]="true">
       </app-file-share-player>

       <!-- FileShare viewer instance: rendered only for non-host viewers while a
         room member is actively sharing a file. -->
       <app-file-share-player *ngIf="CurrentPlayerType==PlayerType.FileShare && !(webRtcService.isPreparingFileShareHost || webRtcService.isFileShareHost)"
                  [UniqueId]="UniqueId"
                  [IsHost]="false">
      </app-file-share-player>

      <!-- RtmpFileShare host instance: shown immediately after the host picks a file. -->
      <app-rtmp-file-share-player
        *ngIf="CurrentPlayerType==PlayerType.RtmpFileShare && (webRtcService.isPreparingRtmpFileShareHost || webRtcService.isRtmpFileShareHost)"
        [UniqueId]="UniqueId"
        [IsHost]="true">
      </app-rtmp-file-share-player>

      <!-- RtmpFileShare viewer instance: shown to non-host members while a file is being shared. -->
      <app-rtmp-file-share-player
        *ngIf="CurrentPlayerType==PlayerType.RtmpFileShare && !(webRtcService.isPreparingRtmpFileShareHost || webRtcService.isRtmpFileShareHost)"
        [UniqueId]="UniqueId"
        [IsHost]="false">
      </app-rtmp-file-share-player>

      <div [class.none]="CurrentPlayerType!=PlayerType.Nothing" class="nothing-playing vh-big">
        <span><i class="fa fa-pause-circle" aria-hidden="true"></i> Nothing playing</span>
      </div>
      <app-mpegts-player *ngIf="CurrentPlayerType==PlayerType.Live"
                         [UniqueId]="UniqueId" [IsHost]="IsHost"></app-mpegts-player>
      <app-youtube *ngIf="CurrentPlayerType==PlayerType.YouTube"
                   [CurrentPlayerType]="CurrentPlayerType" [UniqueId]="UniqueId" [IsHost]="IsHost"></app-youtube>
      <app-videojs-player *ngIf="CurrentPlayerType==PlayerType.External"
                          [CurrentPlayerType]="CurrentPlayerType" [UniqueId]="UniqueId" [IsHost]="IsHost"></app-videojs-player>
      <app-plyr-player *ngIf="CurrentPlayerType==PlayerType.Vimeo"
                       [CurrentPlayerType]="CurrentPlayerType" [UniqueId]="UniqueId" [IsHost]="IsHost"></app-plyr-player>
      <app-twitch *ngIf="CurrentPlayerType==PlayerType.Twitch"
                  [CurrentPlayerType]="CurrentPlayerType" [UniqueId]="UniqueId" [IsHost]="IsHost"></app-twitch>
    </div>
    <div *ngIf="CurrentPlayerType==PlayerType.WhiteBoard" class="CanvasStyle bg-canvas">
      <app-whiteboard [UniqueId]="UniqueId" [IsDrawing]="IsHost" [class.vh-90]="!nav" [GallowWord]="GallowWord" [Username]="Username">
      </app-whiteboard>
    </div>
    <div *ngIf="CurrentPlayerType==PlayerType.Blackjack">
      <app-blackjack-game [UniqueId]="UniqueId" [logout]="logout" [class.vh-90]="!nav">
      </app-blackjack-game>
    </div>
    <app-webrtc-voip *ngIf="Privileges>=UserPrivileges.Approved&&CurrentPlayerType!==PlayerType.Blackjack&&CurrentPlayerType!==PlayerType.WhiteBoard" [UniqueId]="UniqueId" [logout]="logout"
                     [Privileges]="Privileges"
                     [Username]="Username"></app-webrtc-voip>
    <div class="center-content" *ngIf="CurrentPlayerType==PlayerType.Chess">
      <app-chess-game class="center-mid" [UniqueId]="UniqueId" [Username]="Username"></app-chess-game>
    </div>
  </div>

  <app-playlist [UniqueId]="UniqueId" (nowPlaying)="nowPlaying($event)" [ready]="readyEvent.asObservable()"
                (playlistChange)="playlistChange.emit($event)"></app-playlist>
