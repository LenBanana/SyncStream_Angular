<div class="file-share-container position-relative vh-big bg-black">

  <!-- ── HOST VIEW ─────────────────────────────────────────────────── -->
  <ng-container *ngIf="IsHost">

    <div *ngIf="isLoading" class="file-share-status text-center text-light">
      <div class="spinner-border text-main-color mb-3" role="status">
        <span class="sr-only">Starting stream...</span>
      </div>
      <p class="small">Preparing stream...</p>
    </div>

    <video
      #localVideo
      [class.d-none]="isLoading"
      class="file-share-video w-100 h-100"
      controls
      playsinline
      style="object-fit: contain; max-height: 100%; background: #000;">
    </video>

  </ng-container>

  <!-- ── VIEWER VIEW ───────────────────────────────────────────────── -->
  <ng-container *ngIf="!IsHost">

    <!-- Connecting -->
    <div *ngIf="!hasRemoteStream" class="file-share-status text-center text-light">
      <div class="spinner-border text-main-color mb-3" role="status">
        <span class="sr-only">Connecting...</span>
      </div>
      <p class="small">Connecting to stream...</p>
    </div>

    <!-- Remote video -->
    <video
      #remoteVideo
      [class.d-none]="!hasRemoteStream"
      class="file-share-video w-100 h-100"
      autoplay
      playsinline
      style="object-fit: contain; max-height: 100%; background: #000;">
    </video>

    <!-- Paused overlay -->
    <div *ngIf="hasRemoteStream && isPaused"
         class="position-absolute d-flex flex-column align-items-center justify-content-center text-light pause-overlay">
      <i class="fa fa-pause-circle fa-3x mb-2 text-main-color" aria-hidden="true"></i>
      <span class="small">Paused</span>
    </div>

  </ng-container>

</div>
