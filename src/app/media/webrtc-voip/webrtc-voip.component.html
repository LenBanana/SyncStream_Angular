<!-- Video Call Modal -->
<ng-template #participantTemplate let-participant="participant" let-isLocal="isLocal" let-name="name">
  <div class="row text-center d-flex border-dark rounded p-3 m-0 shadow mb-2">
    <div class="input-group" style="flex-wrap: nowrap">
      <div class="input-group-prepend">
        <div class="btn btn-outline-secondary img-placeholder flex-shrink-0 text-light"
             [class.active-border]="participant.isSpeaking"
             [style.background-color]="getRandomColor(name)">{{ name.charAt(0).toUpperCase() }}</div>
      </div>
      <div class="input-group-prepend" *ngIf="isLocal">
        <button class="btn btn-outline-secondary" (click)="openSettings()" title="Devices">
          <i class="fa fa-cog"></i></button>
      </div>
      <div class="input-group-prepend flex-grow-1">
        <div
          class="btn btn-dark btn-outline-secondary text-light input-group-text pt-2 pl-2 text-left font-weight-bold w-100 border-right-0">{{name}}</div>
      </div>
      <div class="input-group-append" *ngIf="isLocal">
        <button class="btn btn-outline-secondary" (click)="toggleAudio()" [title]="participant.isMuted ? 'Unmute' : 'Mute'">
          <i class="fa" [class.fa-microphone]="!participant.isMuted"
             [class.fa-microphone-slash]="participant.isMuted"
             [class.text-danger]="participant.isMuted"
             [class.text-success]="!participant.isMuted"></i>
        </button>
        <button class="btn btn-outline-secondary" (click)="toggleVideo('webcam')" title="Camera">
          <i class="fa fa-video-camera" [class.text-primary]="!participant.isVideoMuted"></i>
        </button>
        <button class="btn btn-outline-secondary" (click)="toggleVideo('screen')" title="Share screen">
          <i class="fa fa-desktop" [class.text-primary]="!participant.isScreenMuted"></i>
        </button>
        <button class="btn btn-outline-danger" (click)="leaveCall()" title="Leave the call">
          <i class="fa fa-phone"></i>
        </button>
      </div>
      <div class="input-group-append" *ngIf="!isLocal">
        <button class="btn btn-outline-secondary" [class.text-danger]="participant.isMuted || participant.isLocallyMuted"
                [title]="participant.isMuted ? 'Muted' : (participant.isLocallyMuted ? 'Unmute for me' : 'Mute for me')"
                (click)="!participant.isMuted && togglePeerMute(participant)">
          <i class="fa" [class.fa-microphone]="!participant.isMuted && !participant.isLocallyMuted"
             [class.fa-microphone-slash]="participant.isMuted || participant.isLocallyMuted"></i>
        </button>
      </div>
      <div class="input-group-append" *ngIf="hasVideo(participant)">
        <button class="btn btn-outline-secondary" (click)="popOutVideo(webVideoPlayerParent, webVideoPlayer)" title="Pop out">
          <i class="fa fa-external-link-alt"></i>
        </button>
      </div>
    </div>
    <div class="col-12 mt-2" #webVideoPlayerParent>
      <!-- Video only: voices play through the call itself, so they keep playing while this window is closed. -->
      <video #webVideoPlayer
             [class.visually-hidden]="!hasVideo(participant)"
             [srcObject]="participant.stream"
             autoplay muted playsinline class="video rounded">
      </video>
    </div>
  </div>
</ng-template>


<div class="modal fade" data-backdrop="false" id="videoCallModal">
  <div class="modal-dialog modal-dialog-centered modal-xxl">
    <div class="modal-content text-light rounded shadow-none" style="background-color: rgba(0, 0, 0, 0.5)">
      <div class="modal-header text-center">
        <h5 class="modal-title"><span class="text-main-color font-weight-bold">Dreck</span>Call</h5>
        <button type="button" class="close text-light" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-md-4 col-sm-12 user-list-container border-right border-dark bg-transparent" *ngIf="localParticipant">
            <div class="row">
              <div class="col-12" *ngIf="(voipState | async) === 'reconnecting'">
                <span class="badge badge-warning mb-2"><i class="fa fa-refresh fa-spin mr-1"></i>Reconnecting…</span>
              </div>
              <div class="col-12">
                <ng-container
                  *ngTemplateOutlet="participantTemplate; context: {participant: localParticipant, isLocal: true, name: Username || 'You'}"></ng-container>
              </div>
              <div class="col-12">
                <ng-container *ngFor="let participant of remoteParticipants; trackBy: trackParticipant">
                  <ng-container
                    *ngTemplateOutlet="participantTemplate; context: {participant: participant, isLocal: false, name: participant.participantName}"></ng-container>
                </ng-container>
              </div>
            </div>
          </div>
          <div class="chat-container" [class.col-12]="!localParticipant" [class.col-md-8]="localParticipant" [class.col-sm-12]="localParticipant">
            <app-dreckchat [nav]="false" [logout]="logout" [UniqueId]="UniqueId" [Username]="Username" [Privileges]="Privileges"
                           [WhiteBoard]="false"></app-dreckchat>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="webRtcVideoSettingsModal" tabindex="-1" role="dialog" aria-labelledby="settingsModalLabel"
     aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content bg-dark text-white">
      <div class="modal-header">
        <h5 class="modal-title" id="settingsModalLabel">Stream Settings</h5>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="audioDevice">Audio Device</label>
          <select class="form-control bg-secondary text-light border-0 rounded" id="audioDevice"
                  [(ngModel)]="videoSettings.microphoneId">
            <option *ngFor="let device of audioDevices" [value]="device.deviceId">{{ device.label }}</option>
          </select>
        </div>
        <div class="form-group">
          <label for="videoDevice">Video Device</label>
          <select class="form-control bg-secondary text-light border-0 rounded" id="videoDevice"
                  [(ngModel)]="videoSettings.cameraId">
            <option *ngFor="let device of videoDevices" [value]="device.deviceId">{{ device.label }}</option>
          </select>
        </div>
        <label>Max Video Bitrate</label>
        <input type="number" class="form-control my-2 bg-dark text-light border-dark" placeholder="Max Video Bitrate"
               [(ngModel)]="videoSettings.maxVideoBitrate">
        <label>Resolution</label>
        <select class="form-control my-2 bg-dark text-light border-dark" [(ngModel)]="videoSettings.idealResolution">
          <option *ngFor="let res of resolutions" [value]="Resolution[res]">{{ res }} - {{Resolution[res]}}</option>
        </select>
        <label>Framerate</label>
        <input type="number" max="60" class="form-control my-2 bg-dark text-light border-dark"
               placeholder="Ideal Frame Rate" [(ngModel)]="videoSettings.idealFrameRate">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-success" (click)="saveSettings()">Save</button>
        <button type="button" class="btn btn-outline-danger" (click)="cancelSettings()">Close</button>
      </div>
    </div>
  </div>
</div>
